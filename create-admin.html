<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Admin - Jefram Stores</title>
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 32px; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); width: 360px; }
        h2 { margin-top: 0; color: #333; }
        label { display: block; margin: 12px 0 4px; font-size: 13px; color: #555; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { margin-top: 18px; width: 100%; padding: 12px; border: none; border-radius: 8px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; font-weight: 600; cursor: pointer; }
        #result { margin-top: 16px; font-size: 14px; }
        .note { margin-top: 16px; font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Create Admin</h2>
        <!-- SECURITY NOTE: This page creates a Firebase Auth admin account and the
             matching admins/{uid} document. After initial setup, protect or remove
             this file so it cannot be used to self-promote additional admins. -->
        <label>Email</label>
        <input type="email" id="adminEmail" placeholder="admin@jeframstores.com">
        <label>Username (display)</label>
        <input type="text" id="adminUsername" placeholder="master">
        <label>Password (min 6 chars)</label>
        <input type="password" id="adminPassword" placeholder="********">
        <label>Role</label>
        <select id="adminRole">
            <option value="master">master (full access)</option>
            <option value="subadmin">subadmin (products only)</option>
        </select>
        <button onclick="createAdmin()">Create Admin</button>
        <div id="result"></div>
        <p class="note">Admins sign in at <code>admin/login.html</code> with their email &amp; password.</p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
                "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js"
            }
        }
    </script>

    <script type="module">
        import { initializeApp } from "firebase/app";
        import { getFirestore, doc, getDoc, setDoc } from "firebase/firestore";
        import { getAuth, createUserWithEmailAndPassword, signOut } from "firebase/auth";

        const firebaseConfig = {
            apiKey: "AIzaSyAoNFbS548PhPO1XmfXfDBiSfHzJ5WRvDY",
            authDomain: "jefram-stores.firebaseapp.com",
            projectId: "jefram-stores",
            storageBucket: "jefram-stores.firebasestorage.app",
            messagingSenderId: "669495715459",
            appId: "1:669495715459:web:1d6bedbba9dc27cf8e1db6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const resultEl = document.getElementById('result');
        function setResult(html, color) {
            resultEl.innerHTML = `<div style="color:${color};">${html}</div>`;
        }

        window.createAdmin = async function() {
            const email = document.getElementById('adminEmail').value.trim();
            const username = document.getElementById('adminUsername').value.trim();
            const password = document.getElementById('adminPassword').value;
            const role = document.getElementById('adminRole').value;

            if (!email || !username || !password) {
                setResult('Email, username and password are required.', '#dc3545');
                return;
            }
            if (password.length < 6) {
                setResult('Password must be at least 6 characters.', '#dc3545');
                return;
            }

            try {
                // Creates the Firebase Auth user (this also signs them in).
                const userCred = await createUserWithEmailAndPassword(auth, email, password);
                const uid = userCred.user.uid;

                // The admins/{uid} doc gates login + the isAdmin() security rule.
                await setDoc(doc(db, 'admins', uid), {
                    username: username,
                    role: role,
                    email: email,
                    createdAt: new Date().toISOString()
                });

                // Keep the staff directory in sync (display only).
                await setDoc(doc(db, 'admin_users', uid), {
                    name: username,
                    role: role,
                    createdAt: new Date().toISOString()
                });

                // Don't leave the new admin signed in here.
                await signOut(auth);

                setResult(`✅ Admin <strong>${username}</strong> created!<br>Email: ${email}<br>UID: ${uid}<br><br>You can now sign in at <code>admin/login.html</code>.`, '#28a745');
            } catch (error) {
                console.error('Create admin error:', error);
                if (error.code === 'auth/email-already-in-use') {
                    setResult('That email is already registered.', '#dc3545');
                } else if (error.code === 'auth/invalid-email') {
                    setResult('Invalid email address.', '#dc3545');
                } else if (error.code === 'auth/weak-password') {
                    setResult('Password is too weak (min 6 characters).', '#dc3545');
                } else if (error.code === 'auth/requires-recent-login' || error.code === 'permission-denied') {
                    setResult('Permission denied writing admin record. Check firestore.rules allow admin create for request.auth.uid == adminId.', '#dc3545');
                } else {
                    setResult('Error: ' + error.message, '#dc3545');
                }
            }
        };
    </script>
</body>
</html>
